# Release ragkit-dev (PyPI) and rag-kit-dev (npm). Run it by hand, from a tag:
#   Actions > Release > Run workflow > "Use workflow from": the tag vX.Y.Z
#
#   stage = rehearsal  ->  TestPyPI only; the tag must be a pre-release (v0.1.0rc1)
#   stage = release    ->  TestPyPI, then PyPI, then npm; the tag must be final (v0.1.0)
#
# All decisions are made by scripts/release_gate.py (tested), not by shell or by
# GitHub expressions. `verify` emits production=true only for exactly
# stage=release with a final, canonical tag; every production job requires that
# output. Publish jobs publish only files whose SHA-256 matches the manifest the
# CI build job produced in this run, and afterwards compare what PyPI/npm report
# with it. Environments must exist with required reviewers, no admin bypass and
# v* tag-only deployments (checked by `verify`; see RELEASING.md). For a release,
# `verify` also checks npm's public metadata before anything is published: rag-kit-dev
# exists, lists the expected maintainer, and does not have this version yet. npm can
# still fail after PyPI (trusted publisher setup, OIDC, registry outage); that fails the
# run. Publishing uses trusted publishing (OIDC): no tokens are stored.
#
# Recovery: "Re-run failed jobs" (within 30 days; release artifacts are kept that long).
# Before each upload, an upload plan asks the registry what it already has for this
# version: files with exactly the build's hashes are skipped, other bytes fail the
# job, so a re-run completes a partial release without uploading anything twice.
# RELEASING.md has the procedure for each partial-release case.

name: Release

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "rehearsal = TestPyPI only (pre-release tag); release = TestPyPI, PyPI, npm (final tag)"
        type: choice
        options: [rehearsal, release]
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  PYTHONIOENCODING: utf-8
  UV_PYTHON_DOWNLOADS: never

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: authorize stage, tag, versions, environments
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read environment protection settings
    outputs:
      production: ${{ steps.authorize.outputs.production }}
      version: ${{ steps.authorize.outputs.version }}
      npm-version: ${{ steps.authorize.outputs.npm-version }}
    steps:
      - name: Must run from a tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "Start this workflow from a tag (Use workflow from: vX.Y.Z), not a branch."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.18"
          enable-cache: false
      - name: Authorize stage and tag (exact stage, canonical tag, pre-release vs final)
        id: authorize
        env:
          STAGE: ${{ inputs.stage }}
          TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project --with "packaging==26.3" python scripts/release_gate.py \
            --github-output "$GITHUB_OUTPUT" authorize --stage "$STAGE" --tag "$TAG"
      - name: The tag is on main and README links resolve at it
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "$TAG is not on main; merge first, then tag main."; exit 1; }
          python3 scripts/check_readme_links.py --ref "$GITHUB_SHA"
      - name: Publishing environments are protected (fails closed)
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION: ${{ steps.authorize.outputs.production }}
        run: |
          environments=testpypi
          [ "$PRODUCTION" = "true" ] && environments=testpypi,pypi,npm
          uv run --no-project --with "packaging==26.3" python scripts/release_gate.py \
            check-environments --repo "$GITHUB_REPOSITORY" --environments "$environments"
      - name: npm has rag-kit-dev, maintained by us, without this version (release only)
        if: steps.authorize.outputs.production == 'true'
        env:
          VERSION: ${{ steps.authorize.outputs.version }}
        run: |
          uv run --no-project --with "packaging==26.3" python scripts/release_gate.py \
            npm-preflight --version "$VERSION"

  ci:
    name: full CI on the tag
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish-testpypi:
    name: publish to TestPyPI
    needs: [verify, ci]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/ragkit-dev/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.18"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - name: Artifacts are exactly the trusted build's (file list, version, SHA-256)
        env:
          PYTHON_MANIFEST: ${{ needs.ci.outputs.python-manifest }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          uv run --no-project --with "packaging==26.3" python scripts/release_gate.py \
            verify-artifacts --kind python --dir dist --version "$VERSION"
      - name: Upload only what TestPyPI does not already have with these hashes (re-runs)
        id: plan
        env:
          PYTHON_MANIFEST: ${{ needs.ci.outputs.python-manifest }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          uv run --no-project --with "packaging==26.3" python scripts/release_gate.py \
            --github-output "$GITHUB_OUTPUT" upload-plan --index testpypi --dir dist --version "$VERSION"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: steps.plan.outputs.upload == 'true'
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true
      - name: TestPyPI reports exactly the trusted build's SHA-256
        env:
          PYTHON_MANIFEST: ${{ needs.ci.outputs.python-manifest }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          uv run --no-project --with "packaging==26.3" python scripts/release_gate.py \
            check-index --index testpypi --version "$VERSION" --wait 600

  e2e-testpypi:
    name: generator with ragkit-dev from TestPyPI (${{ matrix.os }})
    needs: [verify, publish-testpypi]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Guard - no API key, model cache in temp
        run: |
          test -z "${GOOGLE_API_KEY:-}" || { echo "GOOGLE_API_KEY must not be set"; exit 1; }
          echo "HF_HOME=$RUNNER_TEMP/hf-home" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.18"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-dist
          path: dist-npm
      - name: ragkit-dev only from TestPyPI (dependencies from PyPI); installed files must be this build
        run: |
          python scripts/ci/e2e_generator.py --generator "$(ls dist-npm/*.tgz)" \
            --wheel "$(ls dist/*.whl)" --source testpypi --cases gemini-uv,gemini-pip \
            --work "$RUNNER_TEMP/e2e" --python "$(python -c 'import sys; print(sys.executable)')"

  publish-pypi:
    name: publish to PyPI
    needs: [verify, ci, e2e-testpypi]
    if: needs.verify.outputs.production == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ragkit-dev/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.18"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - name: Artifacts are exactly the trusted build's (file list, version, SHA-256)
        env:
          PYTHON_MANIFEST: ${{ needs.ci.outputs.python-manifest }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          uv run --no-project --with "packaging==26.3" python scripts/release_gate.py \
            verify-artifacts --kind python --dir dist --version "$VERSION"
      - name: Upload only what PyPI does not already have with these hashes (re-runs)
        id: plan
        env:
          PYTHON_MANIFEST: ${{ needs.ci.outputs.python-manifest }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          uv run --no-project --with "packaging==26.3" python scripts/release_gate.py \
            --github-output "$GITHUB_OUTPUT" upload-plan --index pypi --dir dist --version "$VERSION"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: steps.plan.outputs.upload == 'true'
        with:
          print-hash: true
      - name: PyPI reports exactly the trusted build's SHA-256
        env:
          PYTHON_MANIFEST: ${{ needs.ci.outputs.python-manifest }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          uv run --no-project --with "packaging==26.3" python scripts/release_gate.py \
            check-index --index pypi --version "$VERSION" --wait 600

  smoke-pypi:
    name: generator with ragkit-dev from PyPI (${{ matrix.os }})
    needs: [verify, publish-pypi]
    if: needs.verify.outputs.production == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Guard - no API key, model cache in temp
        run: |
          test -z "${GOOGLE_API_KEY:-}" || { echo "GOOGLE_API_KEY must not be set"; exit 1; }
          echo "HF_HOME=$RUNNER_TEMP/hf-home" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.18"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-dist
          path: dist-npm
      - name: requirements.txt resolved from PyPI; installed files must be this build
        run: |
          python scripts/ci/e2e_generator.py --generator "$(ls dist-npm/*.tgz)" \
            --wheel "$(ls dist/*.whl)" --source pypi --cases gemini-uv,gemini-pip \
            --work "$RUNNER_TEMP/e2e" --python "$(python -c 'import sys; print(sys.executable)')"

  publish-npm:
    name: publish rag-kit-dev to npm
    needs: [verify, ci, smoke-pypi]
    if: needs.verify.outputs.production == 'true'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/rag-kit-dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.18"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-dist
          path: dist-npm
      - name: Tarball is exactly the trusted build's (file name, version, SHA-256)
        env:
          NPM_MANIFEST: ${{ needs.ci.outputs.npm-manifest }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          uv run --no-project --with "packaging==26.3" python scripts/release_gate.py \
            verify-artifacts --kind npm --dir dist-npm --version "$VERSION"
      - name: Trusted publishing needs npm 11.5.1 or newer
        run: |
          npm --version
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"
      # The generator pins ragkit-dev==VERSION: right before npm, PyPI must still serve
      # exactly the trusted build's files, none yanked (it may have changed since
      # smoke-pypi, e.g. yanked before a re-run of this job). One look, no waiting.
      - name: PyPI still serves exactly the trusted build, not yanked
        env:
          PYTHON_MANIFEST: ${{ needs.ci.outputs.python-manifest }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          uv run --no-project --with "packaging==26.3" python scripts/release_gate.py \
            check-index --index pypi --version "$VERSION"
      - name: Publish only if npm does not already have this version with these bytes (re-runs)
        id: plan
        env:
          NPM_MANIFEST: ${{ needs.ci.outputs.npm-manifest }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          uv run --no-project --with "packaging==26.3" python scripts/release_gate.py \
            --github-output "$GITHUB_OUTPUT" npm-publish-plan --version "$VERSION"
      - name: Publish the verified tarball (provenance, no lifecycle scripts)
        if: steps.plan.outputs.publish == 'true'
        env:
          NPM_VERSION: ${{ needs.verify.outputs.npm-version }}
        run: npm publish --provenance --access public --ignore-scripts "dist-npm/rag-kit-dev-${NPM_VERSION}.tgz"
      - name: npm reports exactly the trusted build's integrity
        env:
          NPM_MANIFEST: ${{ needs.ci.outputs.npm-manifest }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          uv run --no-project --with "packaging==26.3" python scripts/release_gate.py \
            check-npm --version "$VERSION" --wait 600

  smoke-npm:
    name: npx rag-kit-dev from npm (${{ matrix.os }})
    needs: [verify, publish-npm]
    if: needs.verify.outputs.production == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Guard - no API key, model cache in temp
        run: |
          test -z "${GOOGLE_API_KEY:-}" || { echo "GOOGLE_API_KEY must not be set"; exit 1; }
          echo "HF_HOME=$RUNNER_TEMP/hf-home" >> "$GITHUB_ENV"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.18"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist
      - name: npx rag-kit-dev@version, ragkit-dev from PyPI; installed files must be this build
        env:
          NPM_VERSION: ${{ needs.verify.outputs.npm-version }}
        run: |
          python scripts/ci/e2e_generator.py --generator "rag-kit-dev@${NPM_VERSION}" \
            --wheel "$(ls dist/*.whl)" --source pypi --cases gemini-uv,no-install,refusals \
            --work "$RUNNER_TEMP/e2e" --python "$(python -c 'import sys; print(sys.executable)')"
